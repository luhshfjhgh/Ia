<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap');
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent !important;
    font-family: 'Inter', sans-serif;
    overflow: hidden;
  }
  #panel {
    width: 100%; height: 100%;
    background: rgba(16, 12, 26, 0.94);
    border: 1px solid rgba(168, 100, 255, 0.28);
    border-radius: 20px;
    padding: 26px;
    display: flex; flex-direction: column; gap: 16px;
  }
  #headerRow { display: flex; justify-content: space-between; align-items: center; }
  #title { color: #EDE6FF; font-size: 18px; font-weight: 700; }
  #closeBtn {
    width: 26px; height: 26px; border-radius: 50%;
    background: rgba(255,255,255,0.06); color: #cbb8ff;
    border: 1px solid rgba(190,140,255,0.3);
    font-size: 14px; line-height: 24px; text-align: center; cursor: pointer;
  }
  #closeBtn:hover { background: rgba(150,80,230,0.5); }
  #planLabel { color: #4AECE1; font-size: 13px; font-weight: 600; }
  #pixBox {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 12px; padding: 14px 16px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  #pixKey { color: #fff; font-size: 15px; font-weight: 700; letter-spacing: 0.02em; }
  #copyBtn {
    background: linear-gradient(90deg,#9B5CFF,#6A2FD9); color: #fff; border: none;
    border-radius: 8px; padding: 8px 14px; font-size: 12.5px; font-weight: 700; cursor: pointer;
  }
  #copyBtn:hover { filter: brightness(1.1); }
  #copyBtn.copied { background: linear-gradient(90deg,#4AECE1,#1F9E96); color: #062521; }
  #instructions { color: #cabdea; font-size: 12.5px; line-height: 1.5; }
  #fileRow {
    border: 1.5px dashed rgba(168,100,255,0.4); border-radius: 12px;
    padding: 16px; text-align: center; color: #b7a6df; font-size: 12.5px;
    cursor: pointer;
  }
  #fileRow:hover { border-color: rgba(168,100,255,0.7); background: rgba(255,255,255,0.03); }
  #status { color: #9fefea; font-size: 12px; min-height: 16px; white-space: pre-line; }
</style>
</head>
<body>
<div id="panel">
  <div id="headerRow">
    <div id="title">💳 Pagamento via Pix</div>
    <div id="closeBtn" onclick="window.noxClose && window.noxClose()">✕</div>
  </div>
  <div id="planLabel"></div>
  <div id="pixBox">
    <div id="pixKey">059.022.980-08</div>
    <button id="copyBtn" onclick="copyPix()">Copiar chave Pix</button>
  </div>
  <div id="instructions">Após realizar o pagamento, envie o comprovante para análise (PNG, JPG, JPEG ou PDF).</div>
  <div id="fileRow" onclick="window.noxPickFile && window.noxPickFile()">📎 Clique aqui para selecionar o comprovante</div>
  <div id="status"></div>
</div>

<script>
document.getElementById("planLabel").textContent = "Plano selecionado: " + (window.NOX_PLAN_LABEL || "");

function copyPix() {
  const key = document.getElementById("pixKey").textContent;
  navigator.clipboard.writeText(key).then(() => {
    const btn = document.getElementById("copyBtn");
    btn.textContent = "Copiado ✓";
    btn.classList.add("copied");
    setTimeout(() => { btn.textContent = "Copiar chave Pix"; btn.classList.remove("copied"); }, 1800);
  });
}

// Chamado pelo Python depois de processar o comprovante anexado
window.noxShowStatus = function(msg) {
  document.getElementById("status").textContent = msg;
};

window.addEventListener("keydown", e => {
  if (e.key === "Escape" && window.noxClose) window.noxClose();
});
</script>
</body>
</html>
