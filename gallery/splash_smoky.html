<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800&family=Inter+Tight:wght@500;600&display=swap');

  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent !important;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }
  #wrap {
    display: flex; flex-direction: column; align-items: center; gap: 18px;
    font-family: 'Inter', -apple-system, 'Segoe UI', sans-serif;
  }
  #title {
    font-size: 76px; font-weight: 800; letter-spacing: -0.02em;
    display: flex;
  }
  #title span {
    display: inline-block;
    background: linear-gradient(180deg, #EAFFFD 0%, #4AECE1 55%, #1F9E96 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  #bar {
    width: 0; height: 2px; border-radius: 2px;
    background: linear-gradient(90deg, transparent, #4AECE1, transparent);
    opacity: 0;
    animation: barGrow 1s ease-out 1.55s forwards;
  }
  @keyframes barGrow { from { width: 0; opacity: 0; } to { width: 210px; opacity: 1; } }

  #subtitle {
    font-family: 'Inter Tight', sans-serif;
    font-size: 13px; font-weight: 600; letter-spacing: 0.42em;
    color: #9FEFEA; opacity: 0; text-transform: uppercase;
    animation: subFade 1.1s ease-out 1.75s forwards;
  }
  @keyframes subFade { from { opacity: 0; transform: translateY(6px); } to { opacity: 0.9; transform: none; } }

  @keyframes smt-a{
    from{opacity:0; text-shadow:0 0 18px #4AECE1,0 0 35px #4AECE1; transform:scale(1.54);}
    40%{text-shadow:0 0 51px #4AECE1,0 0 101px #4AECE1;}
    to{opacity:1; text-shadow:0 0 0 #4AECE1; transform:none;}
  }
  @keyframes smt-b{
    from{opacity:0; text-shadow:0 0 18px #4AECE1,0 0 35px #4AECE1; transform:scale(1.32);}
    40%{text-shadow:0 0 51px #4AECE1,0 0 101px #4AECE1;}
    to{opacity:1; text-shadow:0 0 0 #4AECE1; transform:none;}
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="title"></div>
    <div id="bar"></div>
    <div id="subtitle">Enterprise Intelligence</div>
  </div>

<script>
const text = "Nox AI Studio";
const titleEl = document.getElementById("title");
[...text].forEach((ch, i) => {
  const span = document.createElement("span");
  span.textContent = ch === " " ? "\u00A0" : ch;
  span.style.opacity = "0";
  span.style.animation = `${i % 2 === 0 ? "smt-a" : "smt-b"} 1.1s ${(i * 0.06).toFixed(2)}s cubic-bezier(0,0,0.58,1) both`;
  titleEl.appendChild(span);
});

// Avisa o Python (via mudança de titulo) quando a animacao termina,
// pra fechar a janela e seguir pro terminal.
setTimeout(() => { document.title = "__NOX_SPLASH_DONE__"; }, 3100);
</script>
</body>
</html>
